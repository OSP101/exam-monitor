services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-monitor
    restart: always
    # The app is only reachable through the nginx reverse proxy (HTTPS).
    expose:
      - "3000"
    volumes:
      - /opt/exam-monitor/data:/app/data
    environment:
      - NODE_ENV=production
      # REQUIRED: master admin PIN and session signing secret.
      # Set these in a .env file next to docker-compose.yml (see .env.example).
      # Without them the app falls back to insecure defaults.
      - ADMIN_MASTER_PIN=${ADMIN_MASTER_PIN}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}

  nginx:
    image: nginx:alpine
    container_name: exam-monitor-nginx
    restart: always
    depends_on:
      - app
    ports:
      # HTTPS entry point. HTTP (80) redirects to HTTPS.
      # First-time setup: run ./scripts/gen-ssl-cert.sh to create ./certs.
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot
