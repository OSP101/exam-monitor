services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-monitor
    restart: always
    ports:
      # host:container — app listens on 3000 inside the container; expose on 80 by default.
      # Override the host side with HOST_PORT in .env (e.g. HOST_PORT=8080).
      - "${HOST_PORT:-80}:3000"
    volumes:
      - /opt/exam-monitor/data:/app/data
    environment:
      - NODE_ENV=production
      # REQUIRED: master admin PIN and session signing secret.
      # Set these in a .env file next to docker-compose.yml (see .env.example).
      # Without them the app falls back to insecure defaults.
      - ADMIN_MASTER_PIN=${ADMIN_MASTER_PIN}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
